# Dark
set -g pane-border-style fg=colour8
set -g pane-active-border-style fg=colour8

set -g status-style bg="#404040",fg=colour15
set -g mode-style bg="#7030AF",fg=colour15

set -g status-left ""
set -g status-right "#(whoami)@#H :: #S"
set -g status-left-length 100
set -g status-right-length 100

set -g window-status-format "#[fg=colour0,bg=colour7] #I:#W#F "
set -g window-status-current-format "#[fg=colour15,bg=colour8] #I:#W#F "
set -g window-status-separator ""
