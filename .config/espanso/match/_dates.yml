matches:
  - trigger: ";date"
    replace: "{{cdate}}"
    vars:
      - name: cdate
        type: date
        params:
          format: "%Y.%m.%d"

  - trigger: ";en.hijri"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "/home/beed/.local/scripts/hijri-date"

  - trigger: ";ar.hijri"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "/home/beed/.local/scripts/hijri-date --arabic"
