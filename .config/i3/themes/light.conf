# Light
set $base        #DFDFDF
set $text        #000000
set $surface2    #C8C8C8
set $overlay0    #808080

set $accent      #F0F0F0
set $indicator   #dfa0f0
set $alert       #dfa0f0
set $warning     #dfa0f0

# class                  border      bg         text     indicator    child_border
client.focused           $accent     $accent    $text    $indicator   $accent
client.focused_inactive  $surface2   $base      $text    $surface2    $surface2
client.unfocused         $surface2   $base      $text    $surface2    $surface2
client.urgent            $warning    $warning   $text    $overlay0    $warning
client.placeholder       $overlay0   $accent    $text    $overlay0    $overlay0
client.background        $base

bar {
  status_command i3blocks
  colors {
    background         $base
    statusline         $text
    focused_statusline $text
    focused_separator  $base

    # target           border    bg        text
    focused_workspace  $accent   $accent   $text
    active_workspace   $surface2 $surface2 $text
    inactive_workspace $surface2 $surface2 $text
    urgent_workspace   $alert    $alert    $text
  }
  mode dock
  modifier none
  tray_output DP-4
  tray_output eDP
}
