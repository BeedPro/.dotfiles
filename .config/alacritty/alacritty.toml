general.import = [
  "~/.config/alacritty/themes/dark.toml"
]

[font]
size = 14.0

normal      = { family = "NotoSansM Nerd Font Mono", style = "Regular" }
bold        = { family = "NotoSansM Nerd Font Mono", style = "Bold" }
italic      = { family = "NotoSansM Nerd Font Mono", style = "Italic" }
bold_italic = { family = "NotoSansM Nerd Font Mono", style = "Bold Italic" }

offset = { x = 0, y = 0 }
glyph_offset = { x = 0, y = 0 }

builtin_box_drawing = true

[window]
padding = { x = 10, y = 10 }
dynamic_padding = true

[keyboard]
bindings = [
  { key = "Plus",  mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
  { key = "Key0",  mods = "Control", action = "ResetFontSize" },
]

[cursor]
style = { shape = "Block", blinking = "Off" }
